<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="rock.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-scissors</title>
  </head>
  <body>
    <div class="container">
      <h2 id="message-el">Choose</h2>
      <button id="rock-el">👊</button>
      <button id="paper-el">✋</button>
      <button id="scissor-el">✌</button>
      <p id="bot-el">🤖:</p>
      <p id="lives-el">💖:3</p>
      <p id="streak-el">🔥:0</p>
    </div>
    <button class="reset" id="reset-el">Reset</button>
    <script src="rock.js"></script>
  </body>
</html>
